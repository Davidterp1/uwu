<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inicio de Sesión - Sistema Solar 3D</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="menu-container">
      <button class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
     <div class="dropdown-content">
        <!-- El contenido del menú se genera dinámicamente -->
    </div>
  </div>
   <video id="background-video" autoplay loop muted >
    <source src="recursos/uwu.mp4" type="video/mp4">
  </video>
  <audio src="recursos/inter.mp3" autoplay loop></audio> 

   <div id="register-container">
    <div id="message-container"></div>
    <h2>Iniciar Sesión</h2>
    <form id="login-form">
        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Iniciar Sesión</button>
        <p class="form-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </form>
</div> 

<script type="module">
    import { initMenu } from './menu.js';
    import { loginUser } from './auth.js';

    initMenu(false);

    const messageContainer = document.getElementById('message-container');
    const form = document.getElementById('login-form');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = form.username.value;
        const password = form.password.value;

        const result = await loginUser(username, password);

        if (result.success) {
            window.location.href = 'index.html'; // Redirigir a la página principal
        } else {
            messageContainer.textContent = `Error: ${result.message}`;
            messageContainer.className = 'error show';
        }
    });
</script>
</body>
</html>
