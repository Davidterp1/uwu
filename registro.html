<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro - Sistema Solar 3D</title>
  <link rel="stylesheet" href="app.css">
</head>
<body >
    <div class="menu-container">
      <button class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
    
      </button>
     <div class="dropdown-content">
        <!-- El contenido del menú se genera dinámicamente -->
    </div>
  </div>
   <video id="background-video" autoplay loop muted >
  <source src="recursos/uwu.mp4" type="video/mp4">
 
</video>
<audio src="recursos/inter.mp3" autoplay loop></audio> 
   <div id="register-container">
    <div id="message-container"></div>
    <h2>Registro</h2>
    <form id="registro-form">
        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" required>
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Registrar</button>
        <p class="form-link">¿Ya tienes cuenta? <a href="inicioSesion.html">Inicia sesión</a></p>
    </form>
</div> 
<script type="module">
    import { initMenu } from './menu.js';
    import { registerUser } from './auth.js';

    // Inicializa solo el menú
    initMenu(false);

    const messageContainer = document.getElementById('message-container');
    const form = document.getElementById('registro-form');

    function showMessage(message, isError = false) {
        messageContainer.textContent = message;
        messageContainer.className = isError ? 'error show' : 'success show';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = form.username.value;
        const email = form.email.value;
        const password = form.password.value;

        const result = await registerUser(username, password, email);

        if (result.success) {
            showMessage(result.message + ' Serás redirigido para iniciar sesión.');
            setTimeout(() => { window.location.href = 'inicioSesion.html'; }, 2000);
        } else {
            showMessage(`Error: ${result.message}`, true);
        }
    });
</script>
</body>
</html>
